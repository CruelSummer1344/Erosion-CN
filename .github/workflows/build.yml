name: Build IPA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run storage and compatibility regressions
        run: bash scripts/test-regressions.sh

      - name: Build Erosion IPA
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-CN-IPA
          path: Erosion_*.ipa
